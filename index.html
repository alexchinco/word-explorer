<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Explorer">
<title>Word Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Andika is made for beginning readers: single-story a and g, clear letter shapes. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@600;700&display=swap">
<style>
/* A story page where every word can be tapped. A sight word just grows and gets a label.
   Any other word grows, splits into pattern chunks with icons for every sound each chunk might make;
   the next tap keeps only the right icons and adds example words; the last tap sends it home.
   Deliberately single (light) theme, matching Equation Hunt. */
:root {
  --sky: #FCE4EC;
  --ink: #1E2B4A;
  --muted: #5D6E8C;
  --tile: #FFFFFF;
  --hi: #D6336C;      /* the letters in a keyword or example that match the chunk */
  --shadow: 0 2px 4px rgba(30, 43, 74, 0.18);
  --read: "Andika", system-ui, sans-serif;
  --display: "Fredoka", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--read); touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }

/* The story */
[hidden] { display: none !important; }
#story { max-width: 780px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 24px 40px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4.4vw, 42px); margin: 0 0 18px; }
#story { transition: opacity 0.2s, transform 0.2s; }
#story.armed { opacity: 0.55; transform: scale(0.98); }
#story p { font-size: clamp(24px, 3.5vw, 34px); line-height: 1.75; margin: 0; }
.w { cursor: pointer; display: inline-block; transition: transform 0.12s; }
.w:active { transform: scale(0.94); }
.w.away { visibility: hidden; }

/* The word screen */
#focus { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
#focus .veil { position: absolute; inset: 0; background: rgba(252, 228, 236, 0.95); }
#focus .close { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; width: 54px; height: 54px; border-radius: 50%;
  background: var(--tile); box-shadow: var(--shadow); font-family: var(--display); font-size: 30px; line-height: 54px; text-align: center; }
.row { position: relative; display: flex; align-items: flex-start; width: max-content; gap: calc(var(--f) * 0.14); }
.col { display: flex; flex-direction: column; align-items: center; gap: calc(var(--f) * 0.16); }
.chunk { font-weight: 700; font-size: var(--f); line-height: 1.15; padding: 0.06em 0.16em 0.1em; text-align: center;
  background: var(--tile); border-radius: 0.18em; box-shadow: var(--shadow); transition: background 0.3s, box-shadow 0.3s; }
.joined .chunk { background: transparent; box-shadow: none; }
.opts { display: flex; flex-direction: column; align-items: center; gap: calc(var(--f) * 0.1); }
.opt { display: flex; flex-direction: column; align-items: center; min-width: calc(var(--f) * 0.95); padding: calc(var(--f) * 0.06) calc(var(--f) * 0.08);
  background: var(--tile); border-radius: calc(var(--f) * 0.16); box-shadow: var(--shadow); }
.opt .em { font-size: calc(var(--f) * 0.5); line-height: 1.2; }
.opt .kw { font-size: max(13px, calc(var(--f) * 0.2)); line-height: 1.2; white-space: nowrap; }
.opt.plain { padding: calc(var(--f) * 0.12) calc(var(--f) * 0.14); }
.opt.plain .kw { font-size: max(18px, calc(var(--f) * 0.3)); }
.opt .kw b, .ex b { color: var(--hi); font-weight: 700; }
.ex { display: flex; flex-direction: column; align-items: center; font-size: max(14px, calc(var(--f) * 0.21)); line-height: 1.35; }
.means { font-family: var(--display); font-weight: 600; font-size: max(14px, calc(var(--f) * 0.2)); color: var(--hi); white-space: nowrap; }
.label, .note { font-family: var(--display); font-weight: 600; background: var(--tile); box-shadow: var(--shadow); border-radius: 999px; white-space: nowrap; }
.label { font-size: max(18px, calc(var(--f) * 0.28)); padding: 0.3em 0.9em; }
.notes { position: absolute; left: 50%; bottom: 100%; margin-bottom: calc(var(--f) * 0.25); transform: translateX(-50%); display: flex; gap: 12px; }
.cap { color: var(--hi); }
.hint { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: clamp(48px, 9vh, 90px);
  line-height: 1.2; padding: 0.12em 0.4em; background: var(--tile); border-radius: 0.4em; box-shadow: var(--shadow); white-space: nowrap; }
.answer { font-weight: 700; font-size: var(--f); line-height: 1.15; padding: 0.06em 0 0.1em 0.2em; white-space: nowrap; }
.answer b { color: var(--hi); }
.note {
  font-size: max(16px, calc(var(--f) * 0.24)); padding: 0.25em 0.8em; color: var(--hi); }
</style>
</head>

<main id="story">
  <h1 id="title"></h1>
  <p id="text"></p>

        SOUNDS[id] = [bits[1].slice(1) + bits[1].slice(1), "[" + c.t + "]", ["cat[s]", "dog[s]", "book[s]"], "more than one " + base];
        c.o = [id]; c.ok = id;
        return c;
      }
      if (bits[1] === "<") { // past tense: it already happened
        SOUNDS["past_" + key] = ["", "walk → walk[ed]", ["jump[ed]", "play[ed]", "paint[ed]"], "already happened"];
        c.o = ["past_" + key]; c.ok = c.o[0];
        return c;
      }
      if (bits[1]) bits[1].split(",").forEach(function (id) {
        if (id.charAt(0) === "!") c.ok = id.slice(1);
        else if (id.slice(-1) === "*") { c.ok = id.slice(0, -1); c.o.push(c.ok); }
        else c.o.push(id);
      });
      if (!c.ok && c.o.length === 1) c.ok = c.o[0];
      if (/^[^aeiouy]+$/.test(c.t) && c.o.length === 1 && c.ok === c.o[0] && !SOUNDS[c.ok][3]) c.o = []; // one-sound consonant: no icons
      return c;
    });
  }
  function bracket(s) { return s.replace("[", "<b>").replace("]", "</b>"); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }


  // ---- A story page: every word is tappable (numbers aren't) ----
  function show(n) {
    var st = STORIES[n];
    $("title").textContent = st.title;
    $("text").textContent = "";
    st.text.split(/([A-Za-z']+)/).forEach(function (part, i) {
      if (i % 2) {
        var s = document.createElement("span");
        s.className = "w"; s.textContent = part;
        s.addEventListener("click", function () { open(s, part); });
        $("text").appendChild(s);
      } else if (part) $("text").appendChild(document.createTextNode(part));
    });
  }
  // The app picks the story: a random one, never the one just read. The button picks another.
  var last = -1;
  try { last = +localStorage.getItem("lastStory"); } catch (e) {}
  function newStory() {
    var pick = Math.floor(Math.random() * STORIES.length);
    if (STORIES.length > 1 && pick === last) pick = (pick + 1 + Math.floor(Math.random() * (STORIES.length - 1))) % STORIES.length;
    last = pick;
    try { localStorage.setItem("lastStory", pick); } catch (e) {}
    show(pick);
  }
  newStory();

  // Switching stories: press and hold anywhere for half a second, then swipe up.
  // A quick tap still opens a word; a hold without a swipe does nothing.
  var hold = null, armed = false, swallow = false, y0 = 0, x0 = 0;
  function disarm() { clearTimeout(hold); hold = null; armed = false; $("story").classList.remove("armed"); }
  document.addEventListener("pointerdown", function (e) {
    if (cur) return;
    y0 = e.clientY; x0 = e.clientX; swallow = false;
    clearTimeout(hold);
    hold = setTimeout(function () { armed = true; swallow = true; $("story").classList.add("armed"); }, 500);
  });
  document.addEventListener("pointermove", function (e) {
    if (!hold && !armed) return;
    if (!armed && Math.hypot(e.clientX - x0, e.clientY - y0) > 12) { clearTimeout(hold); hold = null; return; } // moved too soon: not a hold
    if (armed && y0 - e.clientY > 90) { disarm(); swapStory(); }
  });
  document.addEventListener("pointerup", disarm);
  document.addEventListener("pointercancel", disarm);
  document.addEventListener("touchmove", function (e) { if (armed) e.preventDefault(); }, { passive: false });
  document.addEventListener("click", function (e) { if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
  function swapStory() {
    var st = $("story");
    st.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-60px)" }], { duration: 220, easing: "ease-in", fill: "forwards" }).onfinish = function () {
      newStory();
      st.getAnimations().forEach(function (a) { a.cancel(); });
      st.animate([{ opacity: 0, transform: "translateY(60px)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "cubic-bezier(.2,.8,.3,1)" });
    };
  }
  Object.keys(WORDS).forEach(function (k) { // catch typos in the word list
    parse(WORDS[k], k).forEach(function (c) { c.o.concat(c.ok ? [c.ok] : []).forEach(function (id) { if (!SOUNDS[id]) console.warn("No icon", id, "in", k); }); });
    if (parse(WORDS[k], k).map(function (c) { return c.t; }).join("") !== k) console.warn("Chunks don't spell", k);
    parse(WORDS[k], k).forEach(function (c) {
      c.o.concat(c.ok ? [c.ok] : []).forEach(function (id) {
        var kw = SOUNDS[id] && SOUNDS[id][1].replace(/[\[\]]/g, "").toLowerCase();
        if (id.indexOf("plural_") !== 0 && id.indexOf("past_") !== 0 && kw && (kw === k || k.replace(/(s|ed|ing)$/, "") === kw)) console.warn("Icon gives the word away:", id, "in", k);
      });
    });
  });

  // ---- The word screen ----
  var cur = null; // { span, focus, row, tiles, cols, step, sight, ready, closing }

  function icon(id, cls) {
    var b = document.createElement("div");
    b.className = "opt" + (cls ? " " + cls : "") + (SOUNDS[id][0] ? "" : " plain"); b.dataset.id = id;
    b.innerHTML = (SOUNDS[id][0] ? '<span class="em">' + SOUNDS[id][0] + "</span>" : "") + '<span class="kw">' + bracket(SOUNDS[id][1]) + "</span>";
    return b;
  }

  function open(span, word) {
    if (cur) return;
    var key = word.toLowerCase(), sight = SIGHT.indexOf(key) >= 0;
    if (!sight && !WORDS[key]) { // no data yet: a little wiggle
      span.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(0deg)" }], 300);
      return;
    }
    var chunks = sight ? [{ t: key, o: [] }] : parse(WORDS[key], key);
    var focus = document.createElement("div"), veil = document.createElement("div"), row = document.createElement("div"), x = document.createElement("button");
    focus.id = "focus"; veil.className = "veil"; row.className = "row joined"; x.className = "close"; x.textContent = "×"; x.setAttribute("aria-label", "Close");
    focus.appendChild(veil); focus.appendChild(row); focus.appendChild(x);
    var tiles = [], cols = [], pos = 0;
    chunks.forEach(function (c) {
      var col = document.createElement("div"), tile = document.createElement("div");
      col.className = "col"; tile.className = "chunk";
      tile.textContent = word.substr(pos, c.t.length); // letters as written in the story (keeps a capital)
      pos += c.t.length;
      col.appendChild(tile);
      if (c.o.length) {
        var opts = document.createElement("div");
        opts.className = "opts";
        shuffle(c.o).forEach(function (id) { opts.appendChild(icon(id)); });
        col.appendChild(opts);
      }
      row.appendChild(col);
      tiles.push(tile); cols.push({ col: col, c: c });
    });
    var notes = document.createElement("div");
    notes.className = "notes";
    row.appendChild(notes);
    if (NAMES.indexOf(key) >= 0 && word.charAt(0) !== key.charAt(0)) {
      tiles[0].innerHTML = '<span class="cap">' + tiles[0].textContent.charAt(0) + "</span>" + tiles[0].textContent.slice(1);
      var nm = document.createElement("div");
      nm.className = "note"; nm.textContent = "🏷️ Capital letter: it's a name!";
      notes.appendChild(nm);
    }
    if (sight) {
      var lbl = document.createElement("div");
      lbl.className = "label"; lbl.textContent = "👀 Sight word";
      cols[0].col.appendChild(lbl);
    }
    document.body.appendChild(focus);

    // Size: as big as fits, both across and down.
    var W = window.innerWidth, H = window.innerHeight, most = Math.max(2, Math.max.apply(null, chunks.map(function (c) { return c.o.length; })));
    var f = Math.min(sight ? 150 : 130, (H * 0.8 - 40) / (1.45 + most * 0.95));
    for (var k = 0; k < 3; k++) {
      focus.style.setProperty("--f", f + "px");
      var rw = row.offsetWidth;
      if (rw <= W - 40) break;
      f *= (W - 40) / rw * 0.97;
    }

    cur = { span: span, focus: focus, row: row, tiles: tiles, cols: cols, step: 1, sight: sight, closing: false };
    var g = joinGeometry();
    span.classList.add("away");

    var HOLD = sight ? 450 : 750, SPLIT = 450;
    veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: "ease-out" });
    x.animate([{ opacity: 0 }, { opacity: 0, offset: 0.6 }, { opacity: 1 }], { duration: 900 });
    row.animate([{ transform: g.fly }, { transform: "none" }], { duration: 480, easing: GLIDE });
    if (!sight) {
      tiles.forEach(function (t, i) { // the word holds together, then splits into chunks
        t.animate([{ transform: "translateX(" + g.dx[i] + "px)" }, { transform: "translateX(" + g.dx[i] + "px)", offset: HOLD / (HOLD + SPLIT), easing: POP },
                   { transform: "translateX(0px)" }], { duration: HOLD + SPLIT });
      });
      setTimeout(function () { if (cur && cur.row === row && !cur.closing) row.classList.remove("joined"); }, HOLD);
      cols.forEach(function (cc, i) { // then the icons drop in under each chunk
        each(cc.col.querySelectorAll(".opt"), function (b, j) {
          b.animate([{ opacity: 0, transform: "translateY(-14px) scale(0.6)" }, { opacity: 1, transform: "none" }],
                    { duration: 380, delay: HOLD + SPLIT - 50 + i * 60 + j * 80, easing: POP, fill: "backwards" });
        });
      });
    } else {
      lbl.animate([{ opacity: 0, transform: "scale(0.5)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: HOLD, easing: POP, fill: "backwards" });
    }
    if (nm) nm.animate([{ opacity: 0, transform: "scale(0.5)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: HOLD, easing: POP, fill: "backwards" });
    if (HINTS[key]) cur.hintTimer = setTimeout(function () { // stuck for a while: show a picture hint
      if (!cur || cur.focus !== focus || cur.closing) return;
      var h = document.createElement("div");
      h.className = "hint"; h.textContent = HINTS[key];
      focus.appendChild(h);
      h.animate([{ opacity: 0, transform: "translateX(-50%) translateY(30px) scale(0.6)" }, { opacity: 1, transform: "translateX(-50%)" }], { duration: 450, easing: POP });
    }, 10000);
    cur.ready = Date.now() + HOLD + (sight ? 300 : SPLIT + 300);

    focus.addEventListener("click", function () { advance(); });
    x.addEventListener("click", function (e) { e.stopPropagation(); close(); });
  }

  // Where the letters sit when the word is in one piece, and the trip between the story and the screen.
  function joinGeometry() {
    var c = cur, rr = c.row.getBoundingClientRect(), rects = c.tiles.map(function (t) { return t.getBoundingClientRect(); });
    var pad = parseFloat(getComputedStyle(c.tiles[0]).paddingLeft), widths = rects.map(function (r) { return r.width - 2 * pad; });
    var total = widths.reduce(function (a, b) { return a + b; }, 0), cx = rr.left + rr.width / 2, x0 = cx - total / 2, cy = rects[0].top + rects[0].height / 2;
    var dx = rects.map(function (r, i) { var at = x0; for (var j = 0; j < i; j++) at += widths[j]; return at - (r.left + pad); });
    var sr = c.span.getBoundingClientRect(), s0 = sr.height / rects[0].height;
    c.row.style.transformOrigin = (cx - rr.left) + "px " + (cy - rr.top) + "px";
    return { dx: dx, fly: "translate(" + (sr.left + sr.width / 2 - cx) + "px," + (sr.top + sr.height / 2 - cy) + "px) scale(" + s0 + ")" };
  }

  function advance() {
    if (!cur || cur.closing || Date.now() < cur.ready) return;
    if (cur.step === 1 && !cur.sight) reveal();
    else close();
  }

  // The reveal: in each column only the right icon stays, slides up under its chunk, and gets examples.
  function reveal() {
    var c = cur, key = c.span.textContent.toLowerCase(), tricky = false;
    c.step = 2;
    c.ready = Date.now() + 900;
    var gone = [];
    c.cols.forEach(function (cc) {
      if (!cc.c.o.length) return;
      each(cc.col.querySelectorAll(".opt"), function (b) { if (b.dataset.id !== cc.c.ok) gone.push(b); });
      if (cc.c.o.indexOf(cc.c.ok) < 0) tricky = cc.tricky = true;
    });
    gone.forEach(function (b) { b.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(0.6)" }], { duration: 220, fill: "forwards" }); });
    setTimeout(function () {
      if (cur !== c || c.closing) return;
      var moving = c.tiles.slice(), first;
      c.cols.forEach(function (cc) { var k = cc.col.querySelector('.opt[data-id="' + cc.c.ok + '"]'); if (k) moving.push(k); });
      first = moving.map(function (e) { return e.getBoundingClientRect(); });
      gone.forEach(function (b) { b.getAnimations().forEach(function (a) { a.cancel(); }); b.remove(); });
      var fresh = [];
      c.cols.forEach(function (cc) {
        if (!cc.c.o.length) return;
        var opts = cc.col.querySelector(".opts");
        if (cc.tricky) { var t = icon(cc.c.ok); opts.appendChild(t); fresh.push(t); }
        if (SOUNDS[cc.c.ok][3]) {
          var m = document.createElement("div");
          m.className = "means"; m.textContent = SOUNDS[cc.c.ok][3];
          opts.appendChild(m); fresh.push(m);
        }
        var ex = SOUNDS[cc.c.ok][2].filter(function (w) { return key.indexOf(w.replace(/[\[\]]/g, "").toLowerCase()) !== 0; }).slice(0, 3); // not the word itself
        if (ex.length) {
          var d = document.createElement("div");
          d.className = "ex";
          d.innerHTML = ex.map(function (w) { return "<span>" + bracket(w) + "</span>"; }).join("");
          opts.appendChild(d); fresh.push(d);
        }
      });
      if (ANSWERS[key]) { // "eight = 8"
        var an = document.createElement("div");
        an.className = "answer"; an.innerHTML = "= <b>" + ANSWERS[key] + "</b>";
        c.row.appendChild(an); fresh.unshift(an);
      }
      moving.forEach(function (e, i) { // slide from where they were to where they are now
        var r = e.getBoundingClientRect(), ddx = first[i].left - r.left, ddy = first[i].top - r.top;
        if (Math.abs(ddx) + Math.abs(ddy) > 0.5) e.animate([{ transform: "translate(" + ddx + "px," + ddy + "px)" }, { transform: "none" }], { duration: 360, easing: GLIDE });
      });
      fresh.forEach(function (e, i) {
        e.animate([{ opacity: 0, transform: "translateY(-10px)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: 260 + i * 60, easing: "ease-out", fill: "backwards" });
      });
      if (tricky) {
        var n = document.createElement("div");
        n.className = "note"; n.textContent = "Tricky one!";
        c.row.querySelector(".notes").appendChild(n);
        n.animate([{ opacity: 0, transform: "scale(0.5)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: 200, easing: POP, fill: "backwards" });
      }
    }, 230);
  }

  // Closing runs the opening backwards: everything under the word goes, the chunks join up, the word flies home.
  function close() {
    if (!cur || cur.closing) return;
    var c = cur;
    c.closing = true;
    clearTimeout(c.hintTimer);
    each(c.focus.querySelectorAll(".hint"), function (h) { h.remove(); });
    c.focus.getAnimations({ subtree: true }).forEach(function (a) { a.finish(); });
    var g = joinGeometry();
    each(c.row.querySelectorAll(".opts, .label, .notes, .answer"), function (o) { o.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: "forwards" }); });
    c.row.classList.add("joined");
    c.tiles.forEach(function (t, i) {
      t.animate([{ transform: "translateX(0px)" }, { transform: "translateX(" + g.dx[i] + "px)" }], { duration: 280, delay: 120, easing: "ease-in-out", fill: "forwards" });
    });
    c.row.animate([{ transform: "none" }, { transform: g.fly }], { duration: 380, delay: 400, easing: "cubic-bezier(.5,0,.7,1)", fill: "forwards" });
    c.focus.querySelector(".veil").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, delay: 400, fill: "forwards" });
    c.focus.querySelector(".close").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: "forwards" });
    setTimeout(function () { c.span.classList.remove("away"); c.focus.remove(); cur = null; }, 790);
  }
  window.addEventListener("resize", function () { if (cur) { cur.span.classList.remove("away"); cur.focus.remove(); cur = null; } });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
